# PID overlay for isaac_multitask vision (isaac_vision_docking.launch.py)
# Tuned for ~1m standoff, noisy pose, Isaac Sim force control

docking_controller_node:
  ros__parameters:
    controller_type: "PID"
    control_rate: 20.0
    velocity_smoothing: 0.82
    force_smoothing: 0.78

    use_trajectory_tracking: false
    range_rate_mode: "brake_only"
    max_closing_rate: 0.002

    pid_kp: [0.004, 0.004, 0.006]
    pid_ki: [0.0002, 0.0002, 0.0004]
    pid_kd: [0.25, 0.25, 0.30]
    pid_kv: [0.05, 0.05, 0.06]

    use_los_guidance: true
    pid_kp_lateral: 0.008
    pid_ki_lateral: 0.0004
    pid_kd_lateral: 0.20

    docking_complete_range: 0.08
    docking_complete_velocity: 0.003
    auto_hold_on_complete: true
    velocity_filter_alpha: 0.25
    pose_jump_threshold: 0.12

    max_velocity_cmd: 0.003
    max_force: 15.0

    # SIGN TUNING: drift RIGHT -> try axis_invert_y: -1.0
    # moves AWAY from target -> flip axis_invert_x
    axis_invert_x: -1.0
    axis_invert_y: 1.0
    axis_invert_z: 1.0

    ground_truth_topic: "/spacecraft/ground_truth_pose"
    log_vision_raw_pose: true
    vision_raw_pose_topic: "/vision_benchmark/pose_xyz_quat"
